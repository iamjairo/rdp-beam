name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    name: Verify version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Extract and compare versions
        run: |
          CARGO_VERSION=$(grep -A5 '\[workspace.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
          NPM_VERSION=$(node -p "require('./web/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Cargo.toml version:           ${CARGO_VERSION}"
          echo "web/package.json version:     ${NPM_VERSION}"
          echo "Git tag version:              ${TAG_VERSION}"

          # desktop-electron/package.json — skip if subproject absent
          ELECTRON_VERSION=""
          if [ -f desktop-electron/package.json ]; then
            ELECTRON_VERSION=$(node -p "require('./desktop-electron/package.json').version")
            echo "desktop-electron version:     ${ELECTRON_VERSION}"
          else
            echo "desktop-electron/package.json not present — skipping"
          fi

          # desktop-tauri/Cargo.toml — skip if subproject absent
          TAURI_VERSION=""
          if [ -f desktop-tauri/Cargo.toml ]; then
            TAURI_VERSION=$(grep '^version' desktop-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
            echo "desktop-tauri/Cargo.toml version: ${TAURI_VERSION}"
          else
            echo "desktop-tauri/Cargo.toml not present — skipping"
          fi

          # desktop-tauri/tauri.conf.json — skip if absent
          TAURI_CONF_VERSION=""
          if [ -f desktop-tauri/tauri.conf.json ]; then
            TAURI_CONF_VERSION=$(node -p "require('./desktop-tauri/tauri.conf.json').version")
            echo "desktop-tauri/tauri.conf.json version: ${TAURI_CONF_VERSION}"
          else
            echo "desktop-tauri/tauri.conf.json not present — skipping"
          fi

          MISMATCH=0
          if [ "${CARGO_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match git tag (${TAG_VERSION})"
            MISMATCH=1
          fi
          if [ "${NPM_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::web/package.json version (${NPM_VERSION}) does not match git tag (${TAG_VERSION})"
            MISMATCH=1
          fi
          if [ "${CARGO_VERSION}" != "${NPM_VERSION}" ]; then
            echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match web/package.json version (${NPM_VERSION})"
            MISMATCH=1
          fi
          if [ -n "${ELECTRON_VERSION}" ] && [ "${CARGO_VERSION}" != "${ELECTRON_VERSION}" ]; then
            echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match desktop-electron/package.json version (${ELECTRON_VERSION})"
            MISMATCH=1
          fi
          if [ -n "${TAURI_VERSION}" ] && [ "${CARGO_VERSION}" != "${TAURI_VERSION}" ]; then
            echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match desktop-tauri/Cargo.toml version (${TAURI_VERSION})"
            MISMATCH=1
          fi
          if [ -n "${TAURI_CONF_VERSION}" ] && [ "${CARGO_VERSION}" != "${TAURI_CONF_VERSION}" ]; then
            echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match desktop-tauri/tauri.conf.json version (${TAURI_CONF_VERSION})"
            MISMATCH=1
          fi
          if [ "${MISMATCH}" -eq 1 ]; then
            echo "::error::Version mismatch detected. All versions must match: Cargo.toml, web/package.json, desktop-electron/package.json, desktop-tauri/Cargo.toml, desktop-tauri/tauri.conf.json, and git tag."
            exit 1
          fi
          echo "All versions match: ${CARGO_VERSION}"

  build-web:
    name: Build web client
    needs: [version-check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web client
        run: cd web && npm ci && npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/

  build-binary:
    name: Build ${{ matrix.target }}
    needs: [version-check]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev \
            libpam0g-dev libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.target }}-

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            target/release/beam-server
            target/release/beam-agent

  package-deb:
    name: Package .deb (${{ matrix.arch }})
    needs: [build-web, build-binary]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - arch: amd64
            artifact_arch: x86_64
          - arch: arm64
            artifact_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.artifact_arch }}
          path: binaries-${{ matrix.artifact_arch }}

      - name: Create staging directory
        run: |
          mkdir -p staging/usr/local/bin staging/usr/share/beam/web/dist
          cp binaries-${{ matrix.artifact_arch }}/beam-server staging/usr/local/bin/
          cp binaries-${{ matrix.artifact_arch }}/beam-agent staging/usr/local/bin/
          cp scripts/beam-doctor staging/usr/local/bin/
          chmod 755 staging/usr/local/bin/*
          cp -r web-dist/* staging/usr/share/beam/web/dist/

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -qq && sudo apt-get install -y nfpm

      - name: Build .deb package
        run: |
          VERSION=$(grep -A5 '\[workspace.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
          ARCH=${{ matrix.arch }} VERSION=${VERSION} nfpm package \
            --config packaging/nfpm.yaml \
            --packager deb \
            --target beam_${VERSION}_${{ matrix.arch }}.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: beam_*.deb

  test-package:
    name: Test .deb (${{ matrix.arch }})
    needs: [package-deb]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.arch }}

      - name: Test .deb install in Docker
        run: |
          docker run --rm -v $(pwd):/debs ubuntu:24.04 bash -c "
            apt-get update -qq &&
            dpkg -i /debs/beam_*_${{ matrix.arch }}.deb || apt-get install -f -y -qq &&
            beam-server --version &&
            beam-doctor --help || true &&
            test -f /usr/share/beam/web/dist/index.html &&
            ls /usr/share/beam/web/dist/assets/*.js >/dev/null 2>&1 &&
            echo 'Web assets verified OK'
          "

  publish-apt:
    name: Publish APT repository
    needs: [test-package]
    runs-on: ubuntu-24.04
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb (amd64)
        uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: deb-amd64

      - name: Download .deb (arm64)
        uses: actions/download-artifact@v4
        with:
          name: deb-arm64
          path: deb-arm64

      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y dpkg-dev

      - name: Import GPG key
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-keys --with-colons | grep '^pub' | head -1 | cut -d: -f5)
          echo "GPG_KEY_ID=${GPG_KEY_ID}" >> $GITHUB_ENV

      - name: Prepare APT repository
        run: |
          mkdir -p apt-repo/pool/main/b/beam apt-repo/gpg
          mkdir -p apt-repo/dists/stable/main/binary-amd64
          mkdir -p apt-repo/dists/stable/main/binary-arm64
          cp deb-amd64/*.deb deb-arm64/*.deb apt-repo/pool/main/b/beam/

          cd apt-repo

          # Generate per-architecture package indices
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k dists/stable/main/binary-amd64/Packages

          dpkg-scanpackages --arch arm64 pool/ > dists/stable/main/binary-arm64/Packages
          gzip -k dists/stable/main/binary-arm64/Packages

          # Generate Release file with architecture info
          cd dists/stable
          apt-ftparchive -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Suite="stable" \
            release . > Release
          gpg --batch --yes --armor --detach-sign --output Release.gpg Release
          gpg --batch --yes --armor --clearsign --output InRelease Release

          cd ../..

          # Export public key
          gpg --armor --export ${GPG_KEY_ID} > gpg/beam.gpg

      - name: Copy landing page
        run: cp packaging/index.html apt-repo/index.html

      - name: Finalize repository
        run: |
          cp packaging/install-beam.sh apt-repo/install || true
          touch apt-repo/.nojekyll

      - name: Deploy to gh-pages
        run: |
          cd apt-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Update APT repository - ${GITHUB_REF_NAME}"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push --force origin gh-pages

  build-electron:
    name: Build Electron (${{ matrix.os }})
    needs: [version-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop-electron/package-lock.json

      - name: Build web renderer
        run: cd web && npm ci && npm run build

      - name: Install Electron dependencies
        run: cd desktop-electron && npm ci

      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: cd desktop-electron && npm run dist:linux

      - name: Build Electron app (macOS)
        if: matrix.os == 'macos-14'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: cd desktop-electron && npm run dist:mac

      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-2022'
        run: cd desktop-electron && npm run dist:win

      - name: Upload Linux artefacts
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux
          path: |
            desktop-electron/dist/*.AppImage
            desktop-electron/dist/*.deb
            desktop-electron/dist/*.snap
            desktop-electron/dist/latest-linux.yml

      - name: Upload macOS artefacts
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos
          path: |
            desktop-electron/dist/*.dmg
            desktop-electron/dist/latest-mac.yml

      - name: Upload Windows artefacts
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: |
            desktop-electron/dist/*.exe
            desktop-electron/dist/*.msi
            desktop-electron/dist/latest.yml

  build-tauri:
    name: Build Tauri (${{ matrix.os }})
    needs: [version-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-tauri/target
          key: tauri-${{ matrix.os }}-${{ hashFiles('desktop-tauri/Cargo.lock') }}
          restore-keys: tauri-${{ matrix.os }}-

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev

      - name: Check Tauri updater pubkey is not placeholder
        shell: bash
        run: |
          PUBKEY=$(node -e "process.stdout.write(require('./desktop-tauri/tauri.conf.json').plugins.updater.pubkey)")
          if [ "${PUBKEY}" = "REPLACE_WITH_PUBKEY_BEFORE_FIRST_RELEASE" ]; then
            echo "::error::tauri.conf.json updater pubkey is still the placeholder value. Set a real minisign public key before releasing."
            exit 1
          fi
          if [ -z "${PUBKEY}" ]; then
            echo "::error::tauri.conf.json updater pubkey is empty. Set a real minisign public key before releasing."
            exit 1
          fi
          echo "Updater pubkey present — OK"

      - name: Build Tauri app (Linux)
        if: matrix.os == 'ubuntu-24.04'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd desktop-tauri && cargo tauri build

      - name: Build Tauri app (macOS)
        if: matrix.os == 'macos-14'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: cd desktop-tauri && cargo tauri build

      - name: Build Tauri app (Windows)
        if: matrix.os == 'windows-2022'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd desktop-tauri && cargo tauri build

      - name: Upload Linux artefacts
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: |
            desktop-tauri/target/release/bundle/deb/*.deb
            desktop-tauri/target/release/bundle/appimage/*.AppImage
            desktop-tauri/target/release/bundle/appimage/*.AppImage.sig
            desktop-tauri/target/release/bundle/deb/*.deb.sig
            desktop-tauri/target/release/bundle/latest.json

      - name: Upload macOS artefacts
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos
          path: |
            desktop-tauri/target/release/bundle/dmg/*.dmg
            desktop-tauri/target/release/bundle/dmg/*.dmg.sig
            desktop-tauri/target/release/bundle/latest.json

      - name: Upload Windows artefacts
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            desktop-tauri/target/release/bundle/msi/*.msi
            desktop-tauri/target/release/bundle/msi/*.msi.sig
            desktop-tauri/target/release/bundle/nsis/*.exe
            desktop-tauri/target/release/bundle/nsis/*.exe.sig
            desktop-tauri/target/release/bundle/latest.json

  package:
    name: Create release
    needs: [build-web, build-binary, test-package, build-electron, build-tauri]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Package tarballs
        run: |
          VERSION="${GITHUB_REF_NAME}"
          for arch in x86_64 aarch64; do
            DIR="beam-${VERSION}-linux-${arch}"
            mkdir -p "${DIR}/bin" "${DIR}/web/dist"

            cp "binaries-${arch}/beam-server" "${DIR}/bin/"
            cp "binaries-${arch}/beam-agent" "${DIR}/bin/"
            chmod 755 "${DIR}/bin/"*

            cp -r web-dist/* "${DIR}/web/dist/"
            cp config/beam.toml "${DIR}/"
            cp systemd/beam.service "${DIR}/"
            cp scripts/install.sh "${DIR}/"
            cp LICENSE "${DIR}/" 2>/dev/null || true
            cp README.md "${DIR}/" 2>/dev/null || true

            tar czf "${DIR}.tar.gz" "${DIR}"
            sha256sum "${DIR}.tar.gz" >> checksums.txt
          done

      - name: Add .deb checksums
        run: |
          sha256sum deb-amd64/*.deb >> checksums.txt
          sha256sum deb-arm64/*.deb >> checksums.txt

      - name: Add desktop artefact checksums
        run: |
          find electron-linux electron-macos electron-windows \
               tauri-linux tauri-macos tauri-windows \
               -type f ! -name '*.yml' ! -name '*.json' \
               -exec sha256sum {} \; >> checksums.txt 2>/dev/null || true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            beam-*.tar.gz
            deb-amd64/*.deb
            deb-arm64/*.deb
            electron-linux/**
            electron-macos/**
            electron-windows/**
            tauri-linux/**
            tauri-macos/**
            tauri-windows/**
            checksums.txt
