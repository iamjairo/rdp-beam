[workspace]
members = ["crates/server", "crates/agent", "crates/protocol"]
resolver = "2"

[workspace.package]
version = "0.3.22"
edition = "2024"
license = "MIT"
authors = ["Beam Contributors"]
repository = "https://github.com/frecar/beam"

[workspace.dependencies]
# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"

# Protocol
beam-protocol = { path = "crates/protocol" }

# Web framework
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tower = "0.5.3"
tower-http = { version = "0.6.10", features = ["fs", "cors", "trace", "limit", "request-id", "uuid"] }

# TLS
rustls = { version = "0.23.40", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.14.8"
tokio-rustls = "0.26.4"

# HTTP internals
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto"] }

# Auth
jsonwebtoken = "9"
pam = "0.8"

# GStreamer
gstreamer = "0.25.2"
gstreamer-app = { version = "0.25", features = ["v1_24"] }
gstreamer-video = "0.25"

# X11
x11rb = { version = "0.13.2", features = ["shm", "randr", "xfixes", "xtest", "allow-unsafe-code"] }

# Wayland (headless compositor / virtual input). Opt-in via the `wayland`
# feature on beam-agent; on 24.04 builds these are not compiled in, so the
# absence of libwayland-dev / wayland-protocols on the build host is fine.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# D-Bus for xdg-desktop-portal ScreenCast session negotiation (Wayland only).
# blocking feature avoids pulling in async runtime — the portal handshake is
# one-shot at startup, not on the hot path.
zbus = { version = "4", default-features = false, features = ["blocking"] }

# Input
nix = { version = "0.31.3", features = ["ioctl", "fs", "process", "signal", "user"] }

# Audio
libpulse-binding = "2"
libpulse-simple-binding = "2"
audiopus = "0.3.0-rc.0"
