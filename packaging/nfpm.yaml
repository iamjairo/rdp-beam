name: beam
arch: "${ARCH}"
platform: linux
version: v${VERSION}
maintainer: "Beam Contributors"
description: "GPU-accelerated remote desktop streaming to any browser via WebCodecs"
vendor: "Beam"
homepage: "https://github.com/frecar/beam"
license: "MIT"

depends:
  - libc6 (>= 2.38)
  - libgstreamer1.0-0 (>= 1.24)
  - gstreamer1.0-plugins-base
  - gstreamer1.0-plugins-good
  - libxcb1
  - libxcb-shm0
  - libxcb-randr0
  - libxcb-xfixes0
  - libpulse0
  - libopus0
  - libpam0g
  - xserver-xorg-core
  - xserver-xorg-video-dummy
  - x11-xserver-utils
  - x11-xkb-utils

recommends:
  - gstreamer1.0-plugins-bad
  - gstreamer1.0-plugins-ugly
  - xfce4
  - xfce4-whiskermenu-plugin
  - dbus-x11
  # Audio: pipewire-pulse is preferred on 26.04+; pulseaudio is still valid
  # on 24.04. The agent only cares about the /tmp/.../native socket either
  # provides, so either satisfies the runtime requirement.
  - pipewire-pulse | pulseaudio
  - xclip
  - libcap2-bin
  - gnome-keyring
  - epiphany-browser
  # Wayland backend runtime — installed but not required. Lets a user flip
  # `[session] backend = "wayland"` in beam.toml without a fresh apt run
  # once the agent's wayland code path lands.
  - cage | sway
  - wireplumber
  - xdg-desktop-portal-wlr

suggests:
  - gstreamer1.0-vaapi
  - xdotool

contents:
  - src: staging/usr/local/bin/beam-server
    dst: /usr/local/bin/beam-server
    file_info:
      mode: 0755

  - src: staging/usr/local/bin/beam-agent
    dst: /usr/local/bin/beam-agent
    file_info:
      mode: 0755

  - src: staging/usr/local/bin/beam-doctor
    dst: /usr/local/bin/beam-doctor
    file_info:
      mode: 0755

  - src: staging/usr/share/beam/web/dist
    dst: /usr/share/beam/web/dist
    type: tree

  - src: config/beam-production.toml
    dst: /etc/beam/beam.toml
    type: config|noreplace
    file_info:
      mode: 0640

  - src: systemd/beam.service
    dst: /etc/systemd/system/beam.service
    file_info:
      mode: 0644

  - src: packaging/beam-xorg.conf
    dst: /etc/X11/beam-xorg.conf
    file_info:
      mode: 0644

  - src: packaging/99-beam-uinput.rules
    dst: /etc/udev/rules.d/99-beam-uinput.rules
    file_info:
      mode: 0644

  - src: packaging/pam.d/beam
    dst: /etc/pam.d/beam
    type: config|noreplace
    file_info:
      mode: 0644

  - dst: /var/lib/beam/
    type: dir
    file_info:
      mode: 0755

  - dst: /var/lib/beam/sessions/
    type: dir
    file_info:
      mode: 0700

  - dst: /var/log/beam/
    type: dir
    file_info:
      mode: 0755

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
