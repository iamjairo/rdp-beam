# Tauri shell has its own [workspace] block so its feature flags and build
# scripts don't bleed into the main beam-server/beam-agent build. Bundle
# size and link-time deps are very different here (system webview vs
# GStreamer/x11rb).
[workspace]
resolver = "2"

[package]
name = "beam-desktop-tauri"
version = "0.3.22"
edition = "2024"
description = "Beam Remote Desktop - Tauri native client"
license = "MIT"
publish = false

[[bin]]
name = "beam-desktop-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
anyhow = "1"
